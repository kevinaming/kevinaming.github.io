<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<script>
(function(){
  try {
    var stored = localStorage.getItem('theme');
    var theme = stored === 'light' || stored === 'dark'
      ? stored
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
<title>Mi Horario — Kevin García</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Horario semanal personal de Kevin García, Maestro Recurso de Uso de la Computadora, Escuela Arianys Nicole Rosa Luquis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
.lock-screen{
  min-height:calc(100vh - 61px);
  display:flex; align-items:center; justify-content:center;
  padding:64px 24px;
}
.lock-card{
  max-width:360px; width:100%; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 26px; text-align:center;
}
.lock-card .lock-icon{
  width:40px; height:40px; margin:0 auto 14px; color:var(--teal-deep);
}
.lock-card h1{font-size:1.3rem; margin-bottom:6px;}
.lock-card p{color:var(--ink-soft); font-size:.88rem; margin:0 0 20px;}
.lock-pin-row{display:flex; gap:8px; justify-content:center; margin-bottom:14px;}
.lock-pin-row input{
  width:44px; height:52px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:1.3rem;
  border:1.5px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink);
}
.lock-pin-row input:focus{outline:none; border-color:var(--teal);}
.lock-card button{
  width:100%; font-family:'IBM Plex Mono',monospace; font-size:.88rem; font-weight:600; color:#fff;
  background:var(--teal-btn); border:none; border-radius:9px; padding:11px 18px; cursor:pointer; transition:.15s;
}
.lock-card button:hover{background:var(--teal-btn-hover);}
.lock-error{color:var(--mango-deep); font-size:.82rem; margin-top:12px; min-height:1.2em;}
#protected-root[hidden], .lock-screen[hidden]{display:none;}
</style>
</head>
<body>

<div class="topnav">
  <div class="wrap">
    <a class="brand" href="index.html">Alfabetización Digital · ANRL</a>
    <div class="toolbar-buttons">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.4"/><path d="M12 19.1v2.4"/><path d="M4.2 4.2l1.7 1.7"/><path d="M18.1 18.1l1.7 1.7"/><path d="M2.5 12h2.4"/><path d="M19.1 12h2.4"/><path d="M4.2 19.8l1.7-1.7"/><path d="M18.1 5.9l1.7-1.7"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.2 14.8A8.6 8.6 0 1 1 9.2 3.8a7 7 0 0 0 11 11z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="lock-screen" id="lock-screen">
  <div class="lock-card">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><rect x="4.5" y="10.5" width="15" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7"/></svg>
    <h1>Contenido protegido</h1>
    <p>Ingresa el PIN para ver el horario.</p>
    <form id="lock-form" autocomplete="off">
      <div class="lock-pin-row">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="lock-digit" aria-label="Dígito 1">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="lock-digit" aria-label="Dígito 2">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="lock-digit" aria-label="Dígito 3">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="lock-digit" aria-label="Dígito 4">
      </div>
      <button type="submit">Desbloquear</button>
      <div class="lock-error" id="lock-error"></div>
    </form>
  </div>
</div>

<div id="protected-root" hidden></div>

<script>
(function(){
  var payload = JSON.parse(document.getElementById('enc-payload').textContent);
  var lockScreen = document.getElementById('lock-screen');
  var root = document.getElementById('protected-root');
  var form = document.getElementById('lock-form');
  var errorEl = document.getElementById('lock-error');
  var digits = Array.prototype.slice.call(document.querySelectorAll('.lock-digit'));
  var STORAGE_KEY = 'sch-key-v1';

  function b64ToBytes(b64){
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function bytesToB64(bytes){
    var bin = '';
    var arr = new Uint8Array(bytes);
    for(var i=0;i<arr.length;i++) bin += String.fromCharCode(arr[i]);
    return btoa(bin);
  }

  function reveal(plaintext){
    root.innerHTML = plaintext;
    root.hidden = false;
    lockScreen.hidden = true;
    var cy = document.getElementById('copyright-year');
    if(cy) cy.textContent = new Date().getFullYear();
    var btn = document.getElementById('theme-toggle');
    if(btn){
      var rootEl = document.documentElement;
      function syncButton(theme){
        var isDark = theme === 'dark';
        btn.setAttribute('aria-pressed', String(isDark));
        var label = isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
      }
      syncButton(rootEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
      btn.addEventListener('click', function(){
        var next = rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        rootEl.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch(e) {}
        syncButton(next);
      });
    }
  }

  async function decryptWithKey(key){
    var iv = b64ToBytes(payload.iv);
    var cipher = b64ToBytes(payload.cipher);
    var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, cipher);
    return new TextDecoder().decode(plainBuf);
  }

  async function deriveKeyFromPin(pin){
    var salt = b64ToBytes(payload.salt);
    var keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt: salt, iterations: payload.iterations, hash:'SHA-256'},
      keyMaterial,
      {name:'AES-GCM', length:256},
      true,
      ['decrypt']
    );
  }

  async function tryStoredKey(){
    var stored = null;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch(e) {}
    if(!stored) return false;
    try {
      var raw = b64ToBytes(stored);
      var key = await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['decrypt']);
      var plaintext = await decryptWithKey(key);
      reveal(plaintext);
      return true;
    } catch(e) {
      try { localStorage.removeItem(STORAGE_KEY); } catch(err) {}
      return false;
    }
  }

  digits.forEach(function(input, idx){
    input.addEventListener('input', function(){
      input.value = input.value.replace(/[^0-9]/g, '');
      if(input.value && idx < digits.length - 1) digits[idx+1].focus();
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Backspace' && !input.value && idx > 0) digits[idx-1].focus();
    });
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var pin = digits.map(function(d){ return d.value; }).join('');
    errorEl.textContent = '';
    if(pin.length !== 4){
      errorEl.textContent = 'Ingresa los 4 dígitos.';
      return;
    }
    try {
      var key = await deriveKeyFromPin(pin);
      var plaintext = await decryptWithKey(key);
      try {
        var rawKey = await crypto.subtle.exportKey('raw', key);
        localStorage.setItem(STORAGE_KEY, bytesToB64(rawKey));
      } catch(err) {}
      reveal(plaintext);
    } catch(err){
      errorEl.textContent = 'PIN incorrecto.';
      digits.forEach(function(d){ d.value = ''; });
      digits[0].focus();
    }
  });

  tryStoredKey().then(function(ok){
    if(!ok) digits[0].focus();
  });
})();
</script>
